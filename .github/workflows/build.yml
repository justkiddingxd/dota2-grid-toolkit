name: Approved build
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved package version, for example 1.0.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify approved version
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: node -e "if(require('./package.json').version !== process.env.APPROVED_VERSION) process.exit(1)"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gridstudio-${{ inputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
